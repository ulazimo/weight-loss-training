<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;600&display=swap" rel="stylesheet">

<style>
  :root {
    --pine:      #101B15;
    --platform:  #18271E;
    --raised:    #1F3227;
    --edge:      #2C4736;
    --bone:      #EEEBE1;
    --chalk:     #8DA695;
    --signal:    #E3B505;
    --rust:      #C2603F;

    --display: "Barlow Condensed", "Oswald", "Arial Narrow", sans-serif;
    --body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { -webkit-text-size-adjust: 100%; }

  button, .demo, input { touch-action: manipulation; }

  /* ---------- masthead ---------- */
  .masthead {
    padding: 22px 0 14px;
    border-bottom: 1px solid var(--edge);
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--chalk);
  }
  .masthead h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 40px;
    line-height: 0.95;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 4px 0 0;
  }
  .masthead .meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--chalk);
    margin-top: 6px;
  }

  /* ---------- day switch ---------- */
  .dayswitch { display: flex; gap: 8px; margin: 16px 0 4px; }
  .dayswitch button {
    flex: 1;
    background: transparent;
    border: 1px solid var(--edge);
    color: var(--chalk);
    font-family: var(--display);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 11px 8px 9px;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .dayswitch button .sub {
    display: block;
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.12em;
    opacity: .65;
    margin-top: 2px;
  }
  .dayswitch button[aria-pressed="true"] {
    background: var(--raised);
    border-color: var(--chalk);
    color: var(--bone);
  }
  .nextup {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--signal);
    margin: 8px 0 0;
  }

  /* ---------- exercise card ---------- */
  .card {
    background: var(--platform);
    border: 1px solid var(--edge);
    margin-top: 12px;
  }
  .card.done { border-color: var(--signal); }

  .card-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 13px 14px 10px;
  }
  .slot {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--signal);
    letter-spacing: .06em;
    flex: none;
    width: 26px;
  }
  .card-head .name {
    font-family: var(--display);
    font-size: 23px;
    font-weight: 600;
    line-height: 1.05;
    text-transform: uppercase;
    letter-spacing: .015em;
    flex: 1;
  }
  .target {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--chalk);
    flex: none;
    white-space: nowrap;
  }

  .card-sub {
    padding: 0 14px 12px 50px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    align-items: center;
  }
  .note { font-size: 12.5px; color: var(--chalk); flex: 1 1 100%; }
  .minilink {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--chalk);
    text-decoration: none;
    border-bottom: 1px solid var(--edge);
    padding-bottom: 1px;
    background: none;
    border-left: 0; border-right: 0; border-top: 0;
    cursor: pointer;
  }
  .minilink:hover, .minilink:focus-visible { color: var(--bone); border-color: var(--chalk); }

  .lastline {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--chalk);
    padding: 0 14px 10px 50px;
  }
  .lastline b { color: var(--bone); font-weight: 500; }

  /* ---------- entry grid ---------- */
  .entry {
    display: grid;
    grid-template-columns: 74px 1fr;
    gap: 10px;
    padding: 0 14px 12px;
    align-items: start;
  }
  .fieldlabel {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--chalk);
    display: block;
    margin-bottom: 4px;
  }
  .setrow { display: flex; gap: 8px; }
  .setrow > div { flex: 1; }

  input[type="number"], input[type="text"] {
    width: 100%;
    background: var(--pine);
    border: 1px solid var(--edge);
    color: var(--bone);
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 500;
    text-align: center;
    padding: 10px 2px;
    border-radius: 0;
    -moz-appearance: textfield;
  }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  input:focus { outline: 2px solid var(--signal); outline-offset: -2px; border-color: var(--signal); }
  input::placeholder { color: #4C6653; }

  /* ---------- the ladder ---------- */
  .ladder {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 26px;
    padding: 0 14px;
  }
  .rung {
    width: 15px;
    height: 100%;
    background: var(--pine);
    border: 1px solid var(--edge);
    position: relative;
    overflow: hidden;
  }
  .rung i {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--chalk);
    display: block;
    transition: height .25s ease;
  }
  .rung.top i { background: var(--signal); }
  .verdict {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .04em;
    margin-left: 8px;
    align-self: center;
    color: var(--chalk);
  }
  .verdict.up { color: var(--signal); font-weight: 600; }
  .verdict.down { color: var(--rust); }
  .card .ladder { padding-bottom: 14px; height: 40px; }

  /* ---------- actions ---------- */
  .finish {
    width: 100%;
    margin: 20px 0 8px;
    background: var(--signal);
    color: var(--pine);
    border: none;
    font-family: var(--display);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 15px;
    cursor: pointer;
  }
  .finish:disabled { background: var(--raised); color: var(--chalk); cursor: not-allowed; }
  .ghost {
    width: 100%;
    background: transparent;
    border: 1px solid var(--edge);
    color: var(--chalk);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 11px;
    cursor: pointer;
    margin-bottom: 24px;
  }
  .ghost:hover { color: var(--bone); border-color: var(--chalk); }

  /* ---------- rest timer ---------- */
  .timerbar {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    bottom: 0;
    border-left: 1px solid var(--edge);
    border-right: 1px solid var(--edge);
    background: var(--platform);
    border-top: 1px solid var(--edge);
    display: flex;
    gap: 1px;
    z-index: 20;
  }
  .timerbar button {
    flex: 1;
    background: var(--platform);
    border: none;
    color: var(--chalk);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 14px 4px calc(14px + env(safe-area-inset-bottom));
    cursor: pointer;
  }
  .timerbar button:hover { color: var(--bone); }
  .timerbar .clock {
    flex: 1.2;
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
    color: var(--bone);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: env(safe-area-inset-bottom);
    font-variant-numeric: tabular-nums;
  }
  .timerbar .clock.ring { color: var(--signal); }

  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 18px; margin-top: 14px; }
  .tabs button {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--chalk);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: 0 0 6px;
    cursor: pointer;
  }
  .tabs button[aria-pressed="true"] { color: var(--bone); border-color: var(--signal); }

  /* ---------- history & weight ---------- */
  .logrow {
    border-bottom: 1px solid var(--edge);
    padding: 13px 0;
  }
  .logrow .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--display);
    font-size: 20px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .logrow .top span { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--chalk); text-transform: none; }
  .logrow .detail {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--chalk);
    margin-top: 5px;
    white-space: pre-line;
  }
  .empty {
    color: var(--chalk);
    font-size: 13.5px;
    padding: 28px 0;
    text-align: center;
    border: 1px dashed var(--edge);
    margin-top: 14px;
  }

  .bwbar { height: 5px; background: var(--raised); margin: 12px 0 6px; }
  .bwbar i { display: block; height: 100%; background: var(--signal); }
  .bwstat {
    font-family: var(--display);
    font-size: 46px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: .01em;
  }
  .bwstat small { font-family: var(--mono); font-size: 13px; font-weight: 400; color: var(--chalk); letter-spacing: 0; }
  .bwform { display: flex; gap: 8px; margin: 14px 0 20px; }
  .bwform input { flex: 1; }
  .bwform button {
    background: var(--raised);
    border: 1px solid var(--edge);
    color: var(--bone);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 0 18px;
    cursor: pointer;
  }
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 44px; margin-bottom: 20px; }
  .spark i { flex: 1; background: var(--edge); min-width: 2px; }
  .spark i:last-child { background: var(--signal); }

  .sectiontitle {
    font-family: var(--display);
    font-size: 26px;
    font-weight: 600;
    text-transform: uppercase;
    margin: 20px 0 0;
    letter-spacing: .02em;
  }
  .hint { color: var(--chalk); font-size: 12.5px; margin: 4px 0 0; }
  .storagewarn {
    border: 1px solid var(--rust);
    color: var(--rust);
    font-family: var(--mono);
    font-size: 11px;
    padding: 9px 11px;
    margin-top: 14px;
  }
  /* ---------- exercise demo ---------- */
  .demo {
    position: relative;
    display: block;
    width: 100%;
    height: 158px;
    background: var(--raised);
    border: 0;
    border-top: 1px solid var(--edge);
    border-bottom: 1px solid var(--edge);
    padding: 0;
    overflow: hidden;
    cursor: zoom-in;
  }
  .demo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .demo .phase {
    position: absolute; left: 8px; bottom: 7px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .14em;
    color: var(--pine); background: var(--signal); padding: 2px 6px;
  }
  .demo .zoom {
    position: absolute; right: 8px; bottom: 7px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .14em;
    color: var(--chalk); text-transform: uppercase;
  }
  .demo:focus-visible { outline: 2px solid var(--signal); outline-offset: -2px; }

  /* ---------- lightbox ---------- */
  .lb {
    position: fixed; inset: 0; z-index: 50;
    overscroll-behavior: contain;
    background: rgba(9, 16, 12, .97);
    overflow-y: auto;
    padding: 18px 16px calc(30px + env(safe-area-inset-bottom));
  }
  .lb-inner { max-width: 430px; margin: 0 auto; }
  .lb-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .lb-head h3 {
    font-family: var(--display); font-size: 30px; font-weight: 700;
    text-transform: uppercase; line-height: 1; margin: 0; flex: 1;
  }
  .lb-head .muscle {
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--signal); display: block; margin-top: 5px;
  }
  .lb-close {
    flex: none; background: none; border: 1px solid var(--edge); color: var(--chalk);
    font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
    padding: 7px 12px; cursor: pointer; text-transform: uppercase;
  }
  .lb-close:hover { color: var(--bone); border-color: var(--chalk); }
  .frames { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .frames figure { margin: 0; background: var(--raised); border: 1px solid var(--edge); }
  .frames img { width: 100%; display: block; }
  .frames figcaption {
    font-family: var(--mono); font-size: 9px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--chalk); padding: 6px 8px;
    border-top: 1px solid var(--edge);
  }
  .lb ol { padding-left: 20px; margin: 18px 0 0; }
  .lb li { font-size: 13.5px; color: #C9D5CC; margin-bottom: 9px; line-height: 1.55; }
  .lb .yt { display: inline-block; margin-top: 16px; }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ============ PHONE LAYOUT — applied at every width ============ */
  body { font-size: 14.5px; padding-bottom: 84px; }

  .masthead { padding: 16px 0 11px; }
  .masthead h1 { font-size: 32px; }
  .masthead .meta { font-size: 10.5px; }
  .tabs { gap: 14px; margin-top: 12px; }
  .tabs button { padding-bottom: 9px; font-size: 10.5px; }

  /* day switch follows you down the page */
  .dayswitch {
    position: sticky; top: 0; z-index: 12;
    background: var(--pine);
    margin: 0 -12px 0;
    padding: 8px 12px;
    border-bottom: 1px solid var(--edge);
    gap: 6px;
  }
  .dayswitch button { font-size: 17px; padding: 9px 6px 8px; min-height: 46px; }
  .dayswitch button .sub { font-size: 8.5px; }
  .nextup { font-size: 10.5px; line-height: 1.45; margin-top: 10px; }

  /* cards go edge to edge — more room for the numbers */
  .card { margin-left: -12px; margin-right: -12px; border-left: 0; border-right: 0; }
  .card-head { padding: 11px 12px 8px; gap: 8px; }
  .card-head .name { font-size: 20px; }
  .target { font-size: 11px; }
  .slot { width: 22px; font-size: 10px; }

  /* drop the deep indent — the phone has no width to spare */
  .card-sub { padding: 0 12px 10px; gap: 6px 12px; }
  .lastline { padding: 0 12px 9px; font-size: 11px; line-height: 1.45; }
  .note { font-size: 12px; }
  .minilink { font-size: 9.5px; padding: 4px 0; }

  .demo { height: 132px; }
  .demo .phase, .demo .zoom { font-size: 8.5px; bottom: 6px; }

  .entry { grid-template-columns: 66px 1fr; gap: 8px; padding: 0 12px 11px; }
  .setrow { gap: 6px; }
  input[type="number"], input[type="text"] { font-size: 16px; padding: 12px 2px; }
  .fieldlabel { font-size: 8.5px; }

  .ladder { padding: 0 12px; }
  .card .ladder { padding-bottom: 12px; }
  .rung { width: 13px; }
  .verdict { font-size: 10px; margin-left: 7px; }


  .finish { font-size: 19px; padding: 16px; margin-top: 16px; }

  .timerbar button { font-size: 10px; letter-spacing: .06em; padding: 15px 2px calc(15px + env(safe-area-inset-bottom)); }
  .timerbar .clock { font-size: 18px; }

  .lb { padding: 14px 12px calc(28px + env(safe-area-inset-bottom)); }
  .lb-head h3 { font-size: 25px; }
  .frames { gap: 6px; }
  .lb li { font-size: 13px; }

  .bwstat { font-size: 38px; }
  .sectiontitle { font-size: 23px; }
  .logrow .top { font-size: 18px; }
  

  @media (min-width: 560px) {
    body { background: #0A120D; }
    .wrap {
      background: var(--pine);
      border-left: 1px solid var(--edge);
      border-right: 1px solid var(--edge);
      min-height: 100vh;
      padding-bottom: 24px;
    }
    .dayswitch { background: var(--pine); }
  }

  @media (max-width: 340px) {
    .frames { grid-template-columns: 1fr; }
    .entry { grid-template-columns: 1fr; }
  }
</style>

<div class="wrap">
  <header class="masthead">
    <div class="eyebrow">Full body · 2× week · deficit</div>
    <h1>Training Log</h1>
    <div class="meta" id="meta">Loading…</div>
    <nav class="tabs">
      <button id="tab-train" aria-pressed="true">Train</button>
      <button id="tab-history" aria-pressed="false">History</button>
      <button id="tab-weight" aria-pressed="false">Bodyweight</button>
    </nav>
  </header>

  <!-- TRAIN -->
  <section id="view-train">
    <div class="dayswitch">
      <button id="btn-A" aria-pressed="true">Day A<span class="sub">Squat focus</span></button>
      <button id="btn-B" aria-pressed="false">Day B<span class="sub">Hinge focus</span></button>
    </div>
    <p class="nextup" id="nextup"></p>
    <div id="storagewarn"></div>
    <div id="exercises"></div>
    <button class="finish" id="finish">Finish session</button>
    <button class="ghost" id="clearform">Clear entries</button>
  </section>

  <!-- HISTORY -->
  <section id="view-history" hidden>
    <h2 class="sectiontitle">Completed sessions</h2>
    <p class="hint">Newest first. Weight × reps per set.</p>
    <div id="historylist"></div>
    <button class="ghost" id="export" style="margin-top:18px">Export a backup file</button>
  </section>

  <!-- WEIGHT -->
  <section id="view-weight" hidden>
    <h2 class="sectiontitle">Bodyweight</h2>
    <p class="hint">Goal 95 kg. Judge by the weekly trend, not any single morning.</p>
    <div id="bwsummary"></div>
    <div class="bwform">
      <input type="number" id="bwinput" inputmode="decimal" step="0.1" placeholder="kg">
      <button id="bwadd">Log</button>
    </div>
    <div class="spark" id="bwspark"></div>
    <div id="bwlist"></div>
  </section>
</div>

<div class="lb" id="lightbox" hidden><div class="lb-inner" id="lb-inner"></div></div>

<div class="timerbar">
  <button data-rest="60">60 s</button>
  <button data-rest="90">90 s</button>
  <div class="clock" id="clock">–:––</div>
  <button data-rest="120">2 min</button>
  <button data-rest="0">Stop</button>
</div>

<script>
/* ============================================================
   PROGRAM DEFINITION
   Exercise names + ids from github.com/yuhonas/free-exercise-db
   ============================================================ */
const REF = "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/";

/* Primary muscle + coaching steps, taken verbatim from the same dataset. */

/* ============================================================
   STORAGE
   ============================================================ */
const KEY = "traininglog:v1";
let DB = { sessions: [], bodyweight: [], alts: {}, level: 1 };
let storageOK = true;
let store = "memory";   // "claude" | "local" | "memory"

/* Where we can save depends on how this page was opened.
   In the Claude artifact viewer, window.storage exists.
   Opened as a downloaded file, it doesn't — browser storage handles it. */
function detectStore() {
  try {
    if (window.storage && typeof window.storage.get === "function") return "claude";
  } catch (e) { /* fall through */ }
  try {
    localStorage.setItem("__probe__", "1");
    localStorage.removeItem("__probe__");
    return "local";
  } catch (e) { /* fall through */ }
  return "memory";
}

async function loadDB() {
  store = detectStore();
  storageOK = store !== "memory";
  let raw = null;
  try {
    if (store === "claude") {
      const r = await window.storage.get(KEY);
      raw = r && r.value;
    } else if (store === "local") {
      raw = localStorage.getItem(KEY);
    }
  } catch (e) {
    raw = null;   // nothing saved yet — first run
  }
  if (raw) { try { DB = Object.assign(DB, JSON.parse(raw)); } catch (e) {} }
}

async function saveDB() {
  const payload = JSON.stringify(DB);
  try {
    if (store === "claude") await window.storage.set(KEY, payload);
    else if (store === "local") localStorage.setItem(KEY, payload);
    else throw new Error("no store");
    storageOK = true;
  } catch (e) {
    storageOK = false;
  }
  renderWarn();
}

function renderWarn() {
  document.getElementById("storagewarn").innerHTML = storageOK ? "" :
    '<div class="storagewarn">This browser is blocking saved data, so entries will be lost when the page closes. Write your numbers down, or try opening the file outside private browsing.</div>';
}

function exportData() {
  const blob = new Blob([JSON.stringify(DB, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `training-log-${today()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ============================================================
   HELPERS
   ============================================================ */
const $ = id => document.getElementById(id);
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => new Date(d+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});

function liftView(l) {
  const useAlt = DB.alts[l.key] && l.alt;
  return useAlt
    ? { ...l, name: l.alt.name, id: l.alt.id, lo: l.alt.lo, hi: l.alt.hi, st: l.alt.st,
        bw: l.alt.st === null }
    : l;
}

/* Starting-weight estimates, set for someone with prior lifting experience. */
function suggestKg(l) {
  if (!l.st) return null;
  const raw = l.st[DB.level];
  return Math.round(raw / 2.5) * 2.5;
}
function lastFor(key) {
  for (let i = DB.sessions.length - 1; i >= 0; i--) {
    const e = DB.sessions[i].entries[key];
    if (e && e.reps.some(r => r > 0)) return { ...e, date: DB.sessions[i].date };
  }
  return null;
}
function verdictFor(l, weight, reps) {
  const filled = reps.filter(r => r > 0);
  if (filled.length < l.sets) return { cls:"", text:"" };
  if (filled.every(r => r >= l.hi))
    return { cls:"up", text: l.inc ? `Add ${l.inc} kg next time` : "Add reps next time" };
  if (filled.some(r => r < l.lo))
    return { cls:"down", text:"Hold this weight" };
  return { cls:"", text:"Keep climbing" };
}

/* ============================================================
   TRAIN VIEW
   ============================================================ */
let currentDay = "A";

function suggestedDay() {
  const last = DB.sessions[DB.sessions.length - 1];
  return last ? (last.day === "A" ? "B" : "A") : "A";
}

function renderTrain() {
  const day = PROGRAM[currentDay];
  const host = $("exercises");
  host.innerHTML = "";

  day.lifts.forEach(raw => {
    const l = liftView(raw);
    const last = lastFor(l.key);
    const sugg = suggestKg(l);
    const card = document.createElement("article");
    card.className = "card";
    card.dataset.key = l.key;

    const setInputs = Array.from({length: l.sets}, (_, i) =>
      `<div><input type="number" inputmode="numeric" min="0" max="99"
         data-rep="${i}" placeholder="${l.lo}–${l.hi}" aria-label="Set ${i+1} reps"></div>`).join("");

    const rungs = Array.from({length: l.sets}, () =>
      `<div class="rung"><i style="height:0"></i></div>`).join("");

    card.innerHTML = `
      <div class="card-head">
        <div class="slot">${raw.slot}</div>
        <h3 class="name">${l.name}</h3>
        <div class="target">${l.sets}×${l.lo}–${l.hi}</div>
      </div>
      <button class="demo" data-ex="${l.id}" data-name="${l.name}" aria-label="${l.name} — how to perform">
        <img src="${REF}${l.id}/0.jpg" alt="${l.name} demonstration" loading="lazy">
        <span class="phase">Start</span>
        <span class="zoom">Tap for steps</span>
      </button>
      <div class="card-sub">
        <p class="note">${l.note}</p>
        ${raw.alt ? `<button class="minilink" data-swap="${raw.key}">Swap → ${DB.alts[raw.key] ? raw.name : raw.alt.name}</button>` : ""}
      </div>
      <p class="lastline">${last
        ? `Last (${fmtDate(last.date)}): <b>${last.weight ? last.weight + " kg" : "bodyweight"}</b> · <b>${last.reps.join(" / ")}</b>`
        : (l.bw ? "Bodyweight — no history yet." : `No history. Suggested start <b>${sugg} kg</b> — treat set one as a test.`)}</p>
      <div class="entry">
        <div>
          <label class="fieldlabel" for="w_${l.key}">Weight</label>
          <input type="number" inputmode="decimal" step="0.5" min="0" id="w_${l.key}" data-weight
                 placeholder="${l.bw ? "—" : sugg}" ${l.bw ? "disabled" : ""}
                 value="${last && last.weight ? last.weight : ""}">
        </div>
        <div>
          <span class="fieldlabel">Reps by set</span>
          <div class="setrow">${setInputs}</div>
        </div>
      </div>
      <div class="ladder">${rungs}<span class="verdict"></span></div>
    `;
    host.appendChild(card);
  });

  host.querySelectorAll("input").forEach(inp => inp.addEventListener("input", onEntryChange));
  host.querySelectorAll(".demo").forEach(d => d.addEventListener("click", () => openLightbox(d.dataset.ex, d.dataset.name)));
  startLoops();
  host.querySelectorAll("[data-swap]").forEach(b => b.addEventListener("click", () => {
    DB.alts[b.dataset.swap] = !DB.alts[b.dataset.swap];
    saveDB(); renderTrain();
  }));

  $("btn-A").setAttribute("aria-pressed", currentDay === "A");
  $("btn-B").setAttribute("aria-pressed", currentDay === "B");
  const s = suggestedDay();
  $("nextup").textContent = DB.sessions.length
    ? `Last session was ${PROGRAM[DB.sessions[DB.sessions.length-1].day].label} — ${PROGRAM[s].label} is up next.`
    : "First session. Start light: pick weights you could do 3–4 more reps with.";
  updateAll();
}

function onEntryChange(e) { updateCard(e.target.closest(".card")); updateFinish(); }

function readCard(card) {
  const l = liftView(PROGRAM[currentDay].lifts.find(x => x.key === card.dataset.key));
  const w = card.querySelector("[data-weight]");
  const weight = w && w.value ? parseFloat(w.value) : 0;
  const reps = [...card.querySelectorAll("[data-rep]")].map(i => parseInt(i.value) || 0);
  return { l, weight, reps };
}

function updateCard(card) {
  const { l, weight, reps } = readCard(card);
  card.querySelectorAll(".rung").forEach((rung, i) => {
    const r = reps[i] || 0;
    const pct = r <= 0 ? 0 : Math.max(12, Math.min(100, ((r - l.lo + 1) / (l.hi - l.lo + 1)) * 100));
    rung.querySelector("i").style.height = pct + "%";
    rung.classList.toggle("top", r >= l.hi);
  });
  const v = verdictFor(l, weight, reps);
  const el = card.querySelector(".verdict");
  el.textContent = v.text;
  el.className = "verdict " + v.cls;
  card.classList.toggle("done", reps.filter(r => r > 0).length >= l.sets);
}

function updateAll() {
  document.querySelectorAll(".card").forEach(updateCard);
  updateFinish();
}

function updateFinish() {
  const any = [...document.querySelectorAll("[data-rep]")].some(i => parseInt(i.value) > 0);
  $("finish").disabled = !any;
}

async function finishSession() {
  const entries = {};
  document.querySelectorAll(".card").forEach(card => {
    const { l, weight, reps } = readCard(card);
    if (reps.some(r => r > 0)) entries[l.key] = { name: l.name, weight, reps };
  });
  DB.sessions.push({ date: today(), day: currentDay, entries });
  await saveDB();
  currentDay = suggestedDay();
  renderTrain();
  renderHistory();
  renderMeta();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ============================================================
   HISTORY
   ============================================================ */
function renderHistory() {
  const host = $("historylist");
  if (!DB.sessions.length) {
    host.innerHTML = '<p class="empty">Nothing logged yet. Finish a session and it lands here.</p>';
    return;
  }
  host.innerHTML = DB.sessions.slice().reverse().map(s => {
    const lines = Object.values(s.entries).map(e =>
      `${e.name} — ${e.weight ? e.weight + " kg" : "bw"} × ${e.reps.filter(r=>r>0).join(" / ")}`).join("\n");
    return `<div class="logrow">
      <div class="top">${PROGRAM[s.day].label}<span>${fmtDate(s.date)}</span></div>
      <div class="detail">${lines}</div>
    </div>`;
  }).join("");
}

   ============================================================ */
const GOAL = 95;

function renderWeight() {
  const list = DB.bodyweight;
  const sum = $("bwsummary");
  if (!list.length) {
    sum.innerHTML = '<p class="empty">No weigh-ins yet. Log one below.</p>';
    $("bwspark").innerHTML = "";
    $("bwlist").innerHTML = "";
    return;
  }
  const first = list[0].kg, now = list[list.length - 1].kg;
  const total = Math.max(first - GOAL, 0.1);
  const pct = Math.max(0, Math.min(100, ((first - now) / total) * 100));
  sum.innerHTML = `
    <div class="bwstat">${now.toFixed(1)}<small> kg · ${(now - GOAL).toFixed(1)} to go</small></div>
    <div class="bwbar"><i style="width:${pct}%"></i></div>
    <p class="hint">${(first - now).toFixed(1)} kg down from ${first.toFixed(1)} kg · ${pct.toFixed(0)}% of the way to ${GOAL} kg</p>`;

  const vals = list.slice(-30).map(e => e.kg);
  const min = Math.min(...vals) - 0.5, max = Math.max(...vals) + 0.5;
  $("bwspark").innerHTML = vals.map(v =>
    `<i style="height:${((v - min) / (max - min)) * 100}%"></i>`).join("");

  $("bwlist").innerHTML = list.slice().reverse().slice(0, 20).map((e, i, arr) => {
    const prev = arr[i + 1];
    const d = prev ? e.kg - prev.kg : null;
    return `<div class="logrow"><div class="top">${e.kg.toFixed(1)} kg
      <span>${fmtDate(e.date)}${d !== null ? " · " + (d > 0 ? "+" : "") + d.toFixed(1) : ""}</span></div></div>`;
  }).join("");
}

/* ============================================================
   DEMO LOOP  —  the dataset gives two frames per exercise,
   start and finish. Alternating them shows the movement.
   ============================================================ */
let loopId = null, frame = 0;
const stillPreferred = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function startLoops() {
  document.querySelectorAll(".demo img").forEach(img => {
    const id = img.closest(".demo").dataset.ex;
    [0,1].forEach(n => { const p = new Image(); p.src = REF + id + "/" + n + ".jpg"; });
  });
  if (stillPreferred || loopId) return;
  loopId = setInterval(() => {
    frame = frame ? 0 : 1;
    document.querySelectorAll("#view-train .demo").forEach(d => {
      d.querySelector("img").src = REF + d.dataset.ex + "/" + frame + ".jpg";
      d.querySelector(".phase").textContent = frame ? "Finish" : "Start";
    });
  }, 1300);
}

/* ============================================================
   LIGHTBOX  —  both frames, full size, plus the coaching steps
   ============================================================ */
function openLightbox(id, name) {
  const data = EXDATA[id];
  if (!data) return;
  $("lb-inner").innerHTML = `
    <div class="lb-head">
      <div>
        <h3>${name}</h3>
        <span class="muscle">Targets ${data.m.join(", ")}</span>
      </div>
      <button class="lb-close" id="lb-close">Close</button>
    </div>
    <div class="frames">
      <figure><img src="${REF}${id}/0.jpg" alt="${name}, starting position"><figcaption>Start</figcaption></figure>
      <figure><img src="${REF}${id}/1.jpg" alt="${name}, finishing position"><figcaption>Finish</figcaption></figure>
    </div>
    <ol>${data.s.map(step => `<li>${step}</li>`).join("")}</ol>
    <a class="minilink yt" target="_blank" rel="noopener"
       href="https://www.youtube.com/results?search_query=${encodeURIComponent(name + " proper form technique")}">
       Search video demos</a>`;
  $("lightbox").hidden = false;
  document.body.style.overflow = "hidden";
  $("lb-close").onclick = closeLightbox;
  $("lb-close").focus();
}
function closeLightbox() {
  $("lightbox").hidden = true;
  document.body.style.overflow = "";
}
$("lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") closeLightbox(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

/* ============================================================
   REST TIMER
   ============================================================ */
let timerId = null, remain = 0;
function tick() {
  remain--;
  const c = $("clock");
  if (remain <= 0) {
    clearInterval(timerId); timerId = null;
    c.textContent = "REST UP"; c.classList.add("ring");
    return;
  }
  c.textContent = `${Math.floor(remain/60)}:${String(remain%60).padStart(2,"0")}`;
}
document.querySelectorAll(".timerbar [data-rest]").forEach(b => b.addEventListener("click", () => {
  clearInterval(timerId); timerId = null;
  const c = $("clock"); c.classList.remove("ring");
  remain = parseInt(b.dataset.rest);
  if (!remain) { c.textContent = "–:––"; return; }
  c.textContent = `${Math.floor(remain/60)}:${String(remain%60).padStart(2,"0")}`;
  timerId = setInterval(tick, 1000);
}));

/* ============================================================
   NAV + BOOT
   ============================================================ */
function show(view) {
  ["train","history","weight"].forEach(v => {
    $("view-"+v).hidden = v !== view;
    $("tab-"+v).setAttribute("aria-pressed", v === view);
  });
  if (view === "history") renderHistory();
  if (view === "weight") renderWeight();
}
$("tab-train").onclick = () => show("train");
$("tab-history").onclick = () => show("history");
$("tab-weight").onclick = () => show("weight");
$("btn-A").onclick = () => { currentDay = "A"; renderTrain(); };
$("btn-B").onclick = () => { currentDay = "B"; renderTrain(); };
$("finish").onclick = finishSession;
$("clearform").onclick = () => {
  document.querySelectorAll("[data-rep]").forEach(i => i.value = "");
  updateAll();
};
$("export").onclick = exportData;
$("bwadd").onclick = async () => {
  const v = parseFloat($("bwinput").value);
  if (!v || v < 30 || v > 300) return;
  DB.bodyweight.push({ date: today(), kg: v });
  DB.bodyweight.sort((a,b) => a.date.localeCompare(b.date));
  $("bwinput").value = "";
  await saveDB();
  renderWeight();
};

function renderMeta() {
  const n = DB.sessions.length;
  $("meta").textContent = `${n} session${n === 1 ? "" : "s"} logged · ${fmtDate(today())}`;
}

(async function boot() {
  await loadDB();
  currentDay = suggestedDay();
  renderWarn();
  renderMeta();
  renderTrain();
})();
</script>
